<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Idle Warning</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:#1a0a0a; color:#fee2e2;
         display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:26px; text-align:center; }
  .icon { font-size:52px; line-height:1; margin-bottom:10px; }
  h1 { font-size:20px; margin:0 0 10px; color:#fecaca; }
  p { font-size:14px; line-height:1.6; color:#fca5a5; margin:0 0 8px; max-width:420px; }
  .big { font-size:15px; font-weight:700; color:#fff; margin-top:6px; }
  button { margin-top:22px; padding:13px 26px; border:0; border-radius:10px; background:#dc2626; color:#fff;
           font-size:15px; font-weight:700; cursor:pointer; }
  button:hover { background:#b91c1c; }
</style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1>You appear to be idle</h1>
  <p>No keyboard or mouse activity has been detected for over <strong>10 minutes</strong> during your shift.</p>
  <p class="big">This may cause salary deductions and lower your performance rating.</p>
  <p>Please resume work now.</p>
  <button id="resume" type="button">I'm back to work</button>

  <script>
    var btn = document.getElementById('resume');
    btn.addEventListener('click', function () {
      btn.disabled = true;
      window.tracker.closeIdleWarning();
    });
  </script>
</body>
</html>
